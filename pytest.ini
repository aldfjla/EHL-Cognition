[pytest]
testpaths = apps/api/tests packages
python_files = test_*.py
pythonpath = packages/orchestrator/tests
asyncio_mode = auto

# This machine has a ROS install that puts /opt/ros/<distro>/lib/pythonX/site-packages
# on PYTHONPATH globally, which leaks its pytest plugins into our venv. Several of
# them (launch_testing, launch_ros, the ament_* linters) have unmet dependencies and
# crash pytest at collection time with a ModuleNotFoundError that has nothing to do
# with this project. Disable them explicitly rather than turning off plugin autoload
# wholesale, which would also drop pytest-asyncio.
addopts =
    -q
    --import-mode=importlib
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_flake8
    -p no:ament_mypy
    -p no:ament_copyright
    -p no:ament_xmllint
    -p no:ament_lint
    -p no:ament_pep257

filterwarnings =
    ignore::DeprecationWarning
