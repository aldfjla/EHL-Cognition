<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Devin Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #090d12;
        color: #a8f0c6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        background:
          radial-gradient(circle at 15% 10%, #17342c 0, transparent 35%),
          #090d12;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        border: 1px solid #285441;
        border-radius: 10px;
        padding: 20px 22px 24px;
        background: #0d1514;
        box-shadow: 0 16px 50px #0008;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        color: #d6ffe4;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #65e69a;
        box-shadow: 0 0 12px #65e69a;
      }

      p {
        margin: 9px 0;
        line-height: 1.55;
        font-size: 14px;
      }

      .muted {
        color: #648b79;
      }

      .prompt {
        color: #72d7ff;
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 1.05em;
        margin-left: 4px;
        vertical-align: -0.16em;
        background: #a8f0c6;
        animation: blink 1s steps(2, jump-none) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header><span class="dot"></span> Devin desktop · mock session</header>
      <p class="muted">[machine] workspace mounted: /workspaces/panda-pick-and-place</p>
      <p><span class="prompt">devin@runner:~$</span> git status --short</p>
      <p class="muted"> M src/controller.py<br /> M src/path.py</p>
      <p><span class="prompt">devin@runner:~$</span> tail -f /var/log/agent-activity.log</p>
      <p>12:04:18 reading controller.py</p>
      <p>12:04:21 replaying randomized scenario<span class="cursor"></span></p>
    </main>
  </body>
</html>
