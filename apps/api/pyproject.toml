[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotci-api"
version = "0.1.0"
description = "FastAPI orchestrator process: webhook intake, run/agent/artifact REST, and the dashboard WebSocket."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "robotci-orchestrator",
    "robotci-simkit",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
